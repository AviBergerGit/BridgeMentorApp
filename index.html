ב החלש מכריז את המיינור בגובה 3 והפותח עובר."]]},{id:"t36",icon:"OR",name:"ההכרזה השנייה של הפותח במיינור",summary:[["חוזק הפותח","הפותח מתאר בהכרזתו השנייה גם את החלוקה וגם את חוזקו: פותח חלש (12-14) חוזר על סדרתו בגובה 2 - פותח נמוך, הכרזה נמוכה. פותח בינוני (15-17) חוזר על סדרתו בקפיצה לגובה 3. פותח חזק (18+) שואף ל-3NT או מכריז משחק מלא במייג'ור."],["סדרה נוספת וג'אמפ שיפט","עם 12-14 נעדיף להראות סדרה נוספת אם יש. עם 18+ ו-5-4 לפחות כדאי ג'אמפ שיפט. יד חד סדרתית חזקה חצי מאוזנת עם עוצרים - כדאי 3NT; בלי עוצרים מלאים מוצאים סדרה לג'אמפ שיפט, גם אם מדומה."],["אחרי 1NT של המשיב","המשיב שלא הכריז סדרה מול פתיחת 1♣ מחזיק 3+ קלפים ב-♣ (וככל הנראה 4). בידיים חלשות עם בעיה במייג'ורים עדיף לשחק שליט ולחזור ל-2♣."]]},{id:"t37",icon:"MN",name:"מיינור מול NT",summary:[["מתי נשארים במיינור","ידיים עם ניקוד לגיים כשיש אפשרות לברר על עוצרים ואין מספיק עוצרים. בירור עוצרים אפשרי אחרי התאמה במיינור (אינברטד מיינורס), אחרי טרנספר למיינור, ובעזרת צבע רביעי."],["צבע רביעי","הצבע הרביעי מברר על עוצרים לפני ההחלטה בין NT למשחק מלא במיינור. כשמתברר שלשותף אין עוצר - היד מתחזקת אם אין בזבוז נקודות מול קוצר, ומשחקים את המיינור."],["בחוזה של סלאם","אחרי 3NT של הפותח, חזרה למיינור שלו היא הזמנה לסלאם. בחוזה של סלאם, כשאין עוצרים בטוחים, עדיף לשחק בשליט."]]},{id:"t38",icon:"PS",name:"משחקים חלקיים ובריחה לשליט",summary:[["החוזה הנמוך והטוב ביותר","בידיים חלשות, מתחת ל-21 נקודות משולבות, כדאי לחפש את החוזה הנמוך והטוב ביותר מתחת לגובה 2NT. בדרך כלל חוזרים לסדרה הראשונה של הפותח, גם אם היא מיינור; עם קוצר בסדרה הראשונה ותמיכה בשנייה - עוברים."],["בריחה מדאבל מעניש","כשרוצים להעניש אותנו, המקדם צריך להראות העדפה או למצוא סדרה לברוח אליה - גם אם היא מיינור. ההכרזה ככל הנראה לא תסתיים כך, אבל מראים את ההתאמה הטובה ביותר."],["גרבג' סטיימן וטרנספר למיינור","בידיים חלשות מול 1NT נעדיף לשחק שליט גם אם הוא מיינור: גרבג' סטיימן (2♣ ואז פאס על כל תשובה) או טרנספר למיינור עם שישייה ואז פאס."]]}];var Gl={};De(Gl,{questions:()=>i2,topics:()=>s2});var i2=[{id:"s19a1",topic:"t39",wrong:["5♣","5♦","5♠"],ctx ומכין את שאלת ה-RKCB בהמשך. 4NT עכשיו היתה הזמנה כמותית בלבד."}],s2=[{id:"t39",icon:"RK",name:"שאלת קלפי המפתח (RKCB)",summary:[["קלפי המפתח והתשובות","חמישה קלפי מפתח: ארבעת האסים וה-K בסדרת השליט (אס בשליט נספר בין הארבעה). ה-Q בשליט הוא קלף המפתח השישי. תשובות ל-4NT: 5♣ = 0 או 3, 5♦ = 1 או 4, 5♥ = 2 ללא ה-Q בשליט, 5♠ = 2 עם ה-Q בשליט."],["מהי סדרת השליט","הסדרה שהוסכמה, ובלי הסכמה - הסדרה האחרונה שהוכרזה. אחרי פתיחת NT ללא הסכמת שליט, 4NT הוא כמותי ולא שאלת קלפי מפתח."],["מתי סלאם","31+ נקודות ו-5/6 קלפי מפתח מספיקים לסלאם קטן. לסלאם גדול דרושים כל קלפי המפתח (6/6) וספירת 13 לקיחות."]]},{id:"t40",icon:"QA",name:"שאלת ה-Q והמשכים לסלאם גדול",summary:[["שאלת ה-Q בשליט","הצבע הבא שאינו שליט אחרי תשובת קלפי המפתח שואל על ה-Q בשליט. תשובה בסיסית: בלי Q חוזרים לשליט בגובה הנמוך; עם Q מכריזים 6 בשליט."],["תשובות מתקדמות","צבע חדש = יש Q בשליט וגם K באותה סדרה (הנמוכה ביותר), ואולי K נוסף מעליה. 6 בשליט או 6NT = יש Q בלי K צדדי. אם שאלת ה-Q מעל גובה 5 בשליט: בלי Q מכריזים 6 בשליט, צבע חדש = Q+K, ו-5NT = Q בלי K צדדי."],["שאלת מלכים ב-5NT","5NT שואלת על מלכים ספציפיים כשהשותפות מחויבת לסלאם קטן - צעד לקראת סלאם גדול. מראים את המלך הנמוך ביותר (הכרזה בסדרה = יש K בה, אין K מתחת, אולי K מעל). השאלה בסדרה הבאה שואלת על ה-K בה."]]},{id:"t41",icon:"SP",name:"ספלינטרים",summary:[["מהו ספלינטר","קפיצה חסרת משמעות (לא בהכרח כפולה) שמראה: יד מחייבת למשחק מלא, קוצר (סינגלטון או חוסר) בסדרת הקפיצה, התאמה של 4+ קלפים בסדרה האחרונה שהוכרזה - וקובעת אותה כשליט. אפשרית על ידי כל שחקן, גם על מיינורים וגם על מייג'ורים."],["עולם ה-30","סדרת הספלינטר מחוץ למשוואה - ב-3 הסדרות האחרות יש 30 נקודות. המשיב לספלינטר סופר את נקודותיו מחוץ לסדרת הקוצר + הנקודות שהבטיח השותף: 26-27 מתוך 30 מספיקות לשאול ב-4NT על קלפי מפתח; פחות מכך - סוגרים למשחק מלא בגובה 4. לא להסתנוור מנקודות מבוזבזות בסדרת הספלינטר."],["מיני ספלינטר","כששתי קפיצות חסרות משמעות זמינות: הנמוכה = מיני ספלינטר (15-17 גבוהות עם קוצר, מזמינה בלבד) והגבוהה = ספלינטר רגיל (מחייב למשחק מלא). מי שמשחק 2NT Jacoby משתמש בו לידיים מחייבות עם תמיכה, ובספלינטר עם 9-11."]]},{id:"t42",icon:"QT",name:"4NT כמותי והזמנות לסלאם",summary:[["סלאם כמותי","ידיים מאוזנות: 33 נקודות אמיתיות מספיקות לסלאם קטן (לא חסרים 2 אסים - חסרות רק 7 נקודות) ו-37 לסלאם גדול (לא חסר אף אס). עם הבטחת המינימום הזו מכריזים סלאם ישיר בלי לשאול."],["הזמנה ב-4NT","אחרי פתיחת NT או הכרזת NT של הפותח בהכרזתו השנייה, 4NT היא הזמנה כמותית ולא שאלת אסים (16-17 בלי רביעייה במייג'ור מול 1NT). הפותח: פאס עם מינימום או עם 16 בחלוקת 4-3-3-3, ו-6NT עם מקסימום או 16 עם חמישייה/קלפי ביניים. הערכת 16: חמישייה משייכת למקסימום, שתי עשיריות שוות נקודה, חלוקת 4-3-3-3 מפחיתה נקודה."],["הזמנה ב-5NT וקביעת שליט","5NT מזמינה לסלאם גדול (35-36 עם המינימום, 37+ עם המקסימום): מינימום מכריז 6NT ומקסימום 7NT. כדי לשאול על קלפי מפתח אחרי סטיימן או טרנספר חייבים קודם לקבע שליט: אחרי סטיימן - המיג'ור השני בגובה 3 מראה תמיכה; אחרי טרנספר - סדרה נוספת, או טקסס עם שישייה ואז 4NT."]]}];var Yl={};De(Yl,{questions:()=>l2,topics:()=>a2});var l2=[{id:"s23e1",topic:"t43",wrong:["1♥","1♦","P"],ctx:"מה תפתח?",hand:{s:"J7",h:"AKJ52",d:"QJ4",c:"K54"},hcp:15,auction:[],answer:"1NT",expl:"צופים קדימה: אחרי 1♥ ותשובת 1♠ של השותף תהיה בעיה - 1NT יראה 12-14 ו-2NT יראה 18-19. לכן פותחים 1NT מיד עם ה-15-17."},{id:"s23e2",topic:"t43",wrong:["1NT","2NT","1♦"],ctx:"מה תפתח?",hand:{s:"KT7",h:"AKJ92",d:"QJ4",c:"K4"},hcp:17,auction:[],answer:"1♥",expl:"17 נקודות טובות - עם קלפי ביניים, סדרה ארוכה ושלישייה בספייד - מתייחסים אליהן כמו 18: פותחים 1♥ ומכריזים 2NT בהכרזה השנייה."},{id:"s23e10",topic:"t43",wrong:["1♣","1♦","1NT"],ctx:"מה תפתח?",hand:{s:"Q",h:"Q54",d:"Q872",c:"AJ652"},hcp:11,auction:[],answer:"P",expl:"היד חלשה מדי: נקודות מבוזבזות בספייד (Q בודדה) ובעיה צפויה בהכרזה השנייה. ההמלצה היא לעבור."},{id:"s23e11",topic:"t43",wrong:["1♣","1♥","2NT"],ctx:"מה תפתח?",hand:{s:"Q7",h:"KQT4",d:"K2",c:"AJ654"},hcp:15,auction:[],answer:"1NT",expl:"אחרי 1♣ ותשובת 1♠ נתקעים: NT יראה ניקוד לא נכון, חזרה על הקלאב תתחזה לשישייה, וקפיצה גבוהה מדי ביחס לאורך. פותחים 1NT עם החצי מאוזנת - מדייקים בניקוד
