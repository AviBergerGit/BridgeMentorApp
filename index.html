שבירת הטרנספר","הפותח שובר את הטרנספר עם 17 נקודות, 3+ קלפים בסדרת המיינור ושני מכובדים מ-AKQ. אחרי 2♠ השבירה היא 2NT; אחרי 3♣ אין הכרזת ביניים ואין שבירה. אחרי שבירה למשיב שתי אפשרויות: להכריז את המיינור בגובה 3 למשחק חלקי (והפותח עובר), או להכריז 3NT - הוא לא תכנן משחק מלא מהתחלה, אבל אחרי השבירה הבין שיש היתכנות."]]},{id:"t36",icon:"OR",name:"ההכרזה השנייה של הפותח במיינור",summary:[["חוזק הפותח","הפותח מתאר בהכרזתו השנייה גם את החלוקה וגם את חוזקו: פותח חלש (12-14) חוזר על סדרתו בגובה 2 - פותח נמוך, הכרזה נמוכה. פותח בינוני (15-17) חוזר על סדרתו בקפיצה לגובה 3. פותח חזק (18+) שואף ל-3NT או מכריז משחק מלא במייג'ור."],["סדרה נוספת וג'אמפ שיפט","עם 12-14 נעדיף להראות סדרה נוספת אם יש. עם 18+ ו-5-4 לפחות כדאי ג'אמפ שיפט. יד חד סדרתית חזקה חצי מאוזנת עם עוצרים - כדאי 3NT; בלי עוצרים מלאים מוצאים סדרה לג'אמפ שיפט, גם אם מדומה."],["אחרי 1NT של המשיב","המשיב שלא הכריז סדרה מול פתיחת 1♣ מחזיק 3+ קלפים ב-♣ (וככל הנראה 4). בידיים חלשות עם בעיה במייג'ורים עדיף לשחק שליט ולחזור ל-2♣."]]},{id:"t37",icon:"MN",name:"מיינור מול NT",summary:[["מתי נשארים במיינור","ידיים עם ניקוד לגיים כשיש אפשרות לברר על עוצרים ואין מספיק עוצרים. בירור עוצרים אפשרי אחרי התאמה במיינור (אינברטד מיינורס), אחרי טרנספר למיינור, ובעזרת צבע רביעי."],["צבע רביעי","הצבע הרביעי מברר על עוצרים לפני ההחלטה בין NT למשחק מלא במיינור. כשמתברר שלשותף אין עוצר - היד מתחזקת אם אין בזבוז נקודות מול קוצר, ומשחקים את המיינור."],["בחוזה של סלאם","אחרי 3NT של הפותח, חזרה למיינור שלו היא הזמנה לסלאם. בחוזה של סלאם, כשאין עוצרים בטוחים, עדיף לשחק בשליט."]]},{id:"t38",icon:"PS",name:"משחקים חלקיים ובריחה לשליט",summary:[["החוזה הנמוך והטוב ביותר","בידיים חלשות, מתחת ל-21 נקודות משולבות, כדאי לחפש את החוזה הנמוך והטוב ביותר מתחת לגובה 2NT. בדרך כלל חוזרים לסדרה הראשונה של הפותח, גם אם היא מיינור; עם קוצר בסדרה הראשונה ותמיכה בשנייה - עוברים."],["בריחה מדאבל מעניש","כשרוצים להעניש אותנו, המקדם צריך להראות העדפה או למצוא סדרה לברוח אליה - גם אם היא מיינור. ההכרזה ככל הנראה לא תסתיים כך, אבל מראים את ההתאמה הטובה ביותר."],["ג צפון","P"]],answer:"3♠",expl:"ספלינטר: קפיצה חסרת משמעות שמראה יד מחייבת משחק מלא, קוצר בסדרת הקפיצה ותמיכת 4+ בהארט. ההסבר שלך: 3♠ זה ספלינטר (splinter) - קפיצה ללא משמעות."}],D2=[{id:"t39",icon:"RK",name:"שאלת קלפי המפתח (RKCB)",summary:[["קלפי המפתח והתשובות","חמישה קלפי מפתח: ארבעת האסים וה-K בסדרת השליט (אס בשליט נספר בין הארבעה). ה-Q בשליט הוא קלף המפתח השישי. תשובות ל-4NT: 5♣ = 0 או 3, 5♦ = 1 או 4, 5♥ = 2 ללא ה-Q בשליט, 5♠ = 2 עם ה-Q בשליט."],["מהי סדרת השליט","הסדרה שהוסכמה, ובלי הסכמה - הסדרה האחרונה שהוכרזה. אחרי פתיחת NT ללא הסכמת שליט, 4NT הוא כמותי ולא שאלת קלפי מפתח."],["מתי סלאם","31+ נקודות ו-5/6 קלפי מפתח מספיקים לסלאם קטן. לסלאם גדול דרושים כל קלפי המפתח (6/6) וספירת 13 לקיחות."]]},{id:"t40",icon:"QA",name:"שאלת ה-Q והמשכים לסלאם גדול",summary:[["שאלת ה-Q בשליט","הצבע הבא שאינו שליט אחרי תשובת קלפי המפתח שואל על ה-Q בשליט. תשובה בסיסית: בלי Q חוזרים לשליט בגובה הנמוך; עם Q מכריזים 6 בשליט."],["תשובות מתקדמות","צבע חדש = יש Q בשליט וגם K באותה סדרה (הנמוכה ביותר), ואולי K נוסף מעליה. 6 בשליט או 6NT = יש Q בלי K צדדי. אם שאלת ה-Q מעל גובה 5 בשליט: בלי Q מכריזים 6 בשליט, צבע חדש = Q+K, ו-5NT = Q בלי K צדדי."],["שאלת מלכים ב-5NT","5NT שואלת על מלכים ספציפיים כשהשותפות מחויבת לסלאם קטן - צעד לקראת סלאם גדול. מראים את המלך הנמוך ביותר (הכרזה בסדרה = יש K בה, אין K מתחת, אולי K מעל). השאלה בסדרה הבאה שואלת על ה-K בה."]]},{id:"t41",icon:"SP",name:"ספלינטרים",summary:[["מהו ספלינטר","קפיצה חסרת משמעות (לא בהכרח כפולה) שמראה: יד מחייבת למשחק מלא, קוצר (סינגלטון או חוסר) בסדרת הקפיצה, התאמה של 4+ קלפים בסדרה האחרונה שהוכרזה - וקובעת אותה כשליט. אפשרית על ידי כל שחקן, גם על מיינורים וגם על מייג'ורים."],["עולם ה-30","סדרת הספלינטר מחוץ למשוואה - ב-3 הסדרות האחרות יש 30 נקודות. המשיב לספלינטר סופר את נקודותיו מחוץ לסדרת הקוצר + הנקודות שהבטיח השותף: 26-27 מתוך 30 מספיקות לשאול ב-4NT על קלפי מפתח; פחות מכך - סוגרים למשחק מלא בגובה 4. לא להסתנוור מנקודות מבוזבזות בסדרת הספלינטר."],["מיני ספלינטר","כששתי קפיצות חסרות משמעות זמינות: הנמוכה = מיני ספלינטר (15-17 גבוהות עם קוצר, מזמינה בלבד) והגבוהה = ספלינטר רגיל (מחייב למשחק מלא). מי שמשחק 2NT Jacoby משתמש בו לידיים מחייבות עם תמיכה, ובספלינטר עם 9-11."]]},{id:"t42",icon:"QT",name:"4NT כמותי והזמנות לסלאם",summary:[["סלאם כמותי","ידיים מאוזנות: 33 נקודות אמיתיות מספיקות לסלאם קטן (לא חסרים 2 אסים - חסרות רק 7 נקודות) ו-37 לסלאם גדול (לא חסר אף אס). עם הבטחת המינימום הזו מכריזים סלאם ישיר בלי לשאול."],["הזמנה ב-4NT","אחרי פתיחת NT או הכרזת NT של הפותח בהכרזתו השנייה, 4NT היא הזמנה כמותית ולא שאלת אסים (16-17 בלי רביעייה במייג'ור מול 1NT). הפותח: פאס עם מינימום או עם 16 בחלוקת 4-3-3-3, ו-6NT עם מקסימום או 16 עם חמישייה/קלפי ביניים. הערכת 16: חמישייה משייכת למקסימום, שתי עשיריות שוות נקודה, חלוקת 4-3-3-3 מפחיתה נקודה."],["הזמנה ב-5NT וקביעת שליט","5NT מזמינה לסלאם גדול (35-36 עם המינימום, 37+ עם המקסימום): מינימום מכריז 6NT ומקסימום 7NT. כדי לשאול על קלפי מפתח אחרי סטיימן או טרנספר חייבים קודם לקבע שליט: אחרי סטיימן - המיג'ור השני בגובה 3 מראה תמיכה; אחרי טרנספר - סדרה נוספת, או טקסס עם שישייה ואז 4NT."]]}],B2=Object.freeze(Object.defineProperty({__proto__:null,questions:b2,topics:D2},Symbol.toStringTag,{value:"Module"})),M2=[{id:"s23e1",topic:"t43",wrong:["1♥","1♦","P"],ctx:"מה תפתח?",hand:{s:"J7",h:"AKJ52",d:"QJ4",c:"K54"},hcp:15,auction:[],answer:"1NT",expl:"צופים קדימה: אחרי 1♥ ותשובת 1♠ של השותף תהיה בעיה - 1NT יראה 12-14 ו-2NT יראה 18-19. לכן פותחים 1NT מיד עם ה-15-17."},{id:"s23e2",topic:"t43",wrong:["1NT","2NT","1♦"],ctx:"מה תפתח?",hand:{s:"KT7",h:"AKJ92",d:"QJ4",c:"K4"},hcp:17,auction:[],answer:"1♥",expl:"17 נקודות טובות - עם קלפי ביניים, סדרה ארוכה ושלישייה בספייד - מתייחסים אליהן כמו 18: פותחים 1♥ ומכריזים 2NT בהכרזה השנייה."},{id:"s23e10",topic:"t43",wrong:["1♣","1♦","1NT"],ctx:"מה תפתח?",hand:{s:"Q",h:"Q54",d:"Q872",c:"AJ652"},hcp:11,auction:[],answer:"P",expl:"היד חלשה מדי: נקודות מבוזבזות בספייד (Q בודדה) ובעיה צפויה בהכרזה השנייה. ההמלצה היא לעבור."},{id:"s23e11",topic:"t43",wrong:["1♣","1♥","2NT"],ctx:"מה תפתח?",hand:{s:"Q7",h:"KQT4",d:"K2",c:"AJ654"},hcp:15,auct זל."],["גבוה מרצף נגד שליט","ההובלה הטובה ביותר בברידג', לרוב גוברת אפילו על הובלה מסינגלטון. נגד נו-טראמפ צריך 3 מכובדים ברצף (או 2.5); נגד שליט רצף של 2 מספיק ומובילים במלך. ככל שהרצף מלא יותר, ההובלה טובה יותר. A-K נגד שליט: מובילים באס."],["רביעייה מלמעלה: הובלה אקטיבית","עלולה לגבות מחיר. ככל שמובילים מתחת למכובד בכיר יותר, הסיכון למתנה גדול יותר: מתחת למלך הכי מסוכן, מתחת לקווין פחות אבל עדיין מסוכן. דוגמה: שותף משליך J (יד שלישית גבוה) וכרוז זוכה ב-K. אם לכרוז A K - לא ניתנה מתנה (היו זוכים בכל מקרה). אם לכרוז A K J - ניתנה מתנה: ה-J זכה בזכות ההובלה. יש הבדל בין הובלה שלא הצליחה להובלה שנתנה מתנה."],["אסור להוביל מתחת לאס","נגד חוזה בשליט - איסור מוחלט: עלולים לחתוך לך את האס ולא תראה אותו יותר. גם מרצף פנימי (A Q J 10 2) בורחים מהסדרה ומחכים שאחרים ישחקו אותה. אם אין ברירה - עדיף להוביל באס בלי מלך מאשר קטן מתחת לאס. נגד נו-טראמפ האס כמו מכובד אחר ואפשר להוביל מתחתיו."],['דוגמת "אין ברירה"',"כאשר שאר ההובלות גרועות - שליט עם מכובד, מזלג בהארט ודאבלטון עם מכובד בקלאב - ברירת המחדל היא ♦A, הרע במיעוטו."],["סדר העדיפויות בהובלה","גבוה מרצף במקום הראשון. סינגלטון מיד אחריו (יכולים להתחלף, תלוי בדוגמה, בטיב הרצף ובנקודות). אחר כך הובלה לשותף ורביעייה מלמעלה (גם אלה יכולות להתחלף). הובלה מדאבלטון בסדרה שלא דוברה - הכי פחות מומלצת, במיוחד עם מכובד: נותנת מתנות ליריבים."],["הובלה לשותף וגבוה מדאבלטון","בצבע שהשותף הכריז: עם מכובד מובילים בקטן ביותר (כנגזרת של רביעייה מלמעלה). מדאבלטון תמיד גבוה: מ-8 2 מובילים 8, ואפילו מ-3 2 מובילים 3 (כשה-2 יתגלה, ה-3 ייראה גבוה) - אחרת השותף לא יזהה דאבלטון. גם מדאבלטון עם תמונה (J/Q/K/A) מובילים בתמונה."],["צבע חדש באמצע המשחק ו-MUD","פותחים סדרה חדשה: עם תמונה מובילים בקטן, בלי תמונה בשני מלמעלה. משלושה קלפים בלי מכובד (9 6 2) מובילים 6 ובסיבוב הבא זורקים את ה-9 (הגבוה), לא את ה-2 - אחרת השותף יחשוב שיש לך דאבלטון וינסה לתת לך לחתוך."],["הסימון שמכשיל את החוזה","מערב מוביל 6♥ בצבע השותף מ-8 6 2. השותף זוכה וממשיך. אם מערב ישליך 2 (נמוך), השותף יקרא דאבלטון, ימשיך סיבוב שלישי - חיתוך והשלכה לכרוז, וחוזה שהיה אמור ליפול מבוצע. ההשלכה הנכונה היא 8 (גבוה): השותף מבין שיש שלושה ולא ממשיך. האשמה היא של מי שסימן לא נכון, לא של מי שהמשיך."],["כללי סינגלטון וסיום","חושבים פעמיים לפני הובלה מסינגלטון: עם שליטים טובים - לא מובילים מקיצור בכלל. גם עם A K (או A K Q) אפשר להוביל קודם באס, לראות את הדומם ואת קלף השותף, ורק אז להחליט על הסינגלטון."],["סיכום ההובלות: פסיבי-אגרסיבי, שליט וקוצר",""],["ההובלה הטובה בברידג׳","סדרה ארוכה עם רצף מלא: אקטיבית ומפתחת לקיחות, אבל בטוחה לחלוטין - לא יכולה לתת מתנה בשום מקרה. דוחה אפילו הובלה בסינגלטון נגד חוזה בשליט."],["פסיבי מול אגרסיבי","הובלה מתחת למכובדים היא אגרסיבית: ככל שמובילים מתחת ליותר מכובדים, גדל הסיכון ״למכור לקיחה״. הובלה מסדרה בלי מכובד (שני מלמעלה) בטוחה: בכ-90% מהמקרים לא נותנת מתנה, מול כ-40% בהובלה האגרסיבית."],["מתי דווקא אגרסיבי","מה שמוביל לבחירה אגרסיבית הוא סיכוי סביר למצוא כוח אצל השותף (A או Q בסדרה): אז ההובלה מצליחה ולעתים מפילה את החוזה. אם לשותף אין כלום - נתתם מתנה."],["שיטת החישוב משנה את ההובלה","בטופ-בוטום מזהירים מהובלות אגרסיביות: אם היריב מבצע פלוס 1 או פלוס 2 בזכות ההובלה - קיבל תוצאה גבוהה מאוד. ב-⁦IMP⁩ הובלה מסוכנת מתקבלת בברכה: במקרה הרע מתנה קטנה, ובמקרה הטוב הפלת חוזה והרבה ⁦IMP⁩."],["גובה החוזה של היריבים","ככל שהיריבים משחקים גובה גבוה יותר - מובילים פסיבי יותר. נגד ⁦2♠⁩, כשהניקוד בין הצדדים בערך שווה, מובילים אגרסיבי כי הסיכוי למצוא כוח אצל השותף גבוה. נגד סלם - לא מובילים מתחת לתמונה: רוב הנקודות אצל היריבים וסיכויי ההצלחה פוחתים."],["סופרים את הנקודות שלך","עם 12 נקודות נגד משחק מלא, השותף לא יכול להחזיק A ו-K - אין טעם לקוות. עם 2 נקודות נגד ⁦3♠⁩ - הנקודות אצל השותף, והציפייה למצוא אצלו כוח הגיונית מאוד."],["הובלה בשליט: מתי כן ומתי לא","עם Q-x-x בשליט אסור להוביל - המלכה הייתה זוכה בעצמה ובוודאות תלך לאיבוד; גם K דאבלטון אסור, ומתחת למלכה או מלך - אסור בכלל. ההובלה הכי מותרת היא משני קטנים או משלושה קטנים (האמצעי), ורק כשאין הובלה טובה אחרת. לא מובילים עם ארבעה שליטים ולא מסינגלטון. עם A שליט - אפשרי, אבל לא מומלץ."],["למה לא סינגלטון שליט","כשיש לך סינגלטון בשליט, סביר מאוד שלשותף רביעייה - ואם אצלו Q-x-x-x או J-x-x-x, ההובלה חושפת לכרוז את כל המצב ו״עוקרת לשותף שן״: הכרוז יודע בדיוק איך לשחק את הסדרה. מעדיפים שהכרוז יתמודד עם סדרת השליט בעצמו."],["מתי לא להוביל בקוצר","עם שליטים טובים לא מובילים בקוצר: ארבעה שליטים (אפילו לא טובים), שלושה שליטים טובים או סטופר בשליט - החיתוך יפגע בכם בוודאות. עם שליטים קטנים דווקא מומלץ: חותכים עם קלפים חסרי ערך. וכלל חשוב: הובלת קוצר שלא הבשילה לחיתוך - לרוב פגעתם בעצמכם."],["דאבלטון ותמונה דאבלטון","הובלה בדאבלטון - כמה שפחות; סיכויי ההצלחה נמוכים מאוד, אלא אם השותף הכריז את הסדרה. מתמונה דאבלטון (Q-x או J-x) - לא להוביל בכלל, אלא אם השותף הכריז אותה."],["סינגלטון אס","הובלה בסינגלטון A מגביהה ליריבים את הסדרה, ובנוסף צריך שהשותף יזכה ביד כדי לתת לכם חיתוך - בודקים קודם אם זה בכלל ריאלי."]]},{id:"d2",icon:"🥉",name:"יד שלישית גבוהה",source:"6.mp4",summary:[["למה צריכים כללי אצבע בהגנה","הכרוז רואה את קלפי הדומם ויכול לנהל לבד את משחק היד; המגן לא רואה את קלפי השותף - העיניים שלו מכוסות - ולכן הוא צריך כללי אצבע שיוליכו אותו להגנה נכונה. חשוב להבין מאיפה הכללים באים, כדי לדעת מתי לחפש את היוצא מן הכלל."],["מושבי הלקיחה","מי שמתחיל את הלקיחה הוא המוביל; הבא אחריו הוא יד שנייה; השלישי הוא יד שלישית. אם אתה יד שלישית, בהכרח השותף שלך הוביל את הלקיחה - ולא דווקא הובלת פתיחה: יד שלישית קיימת בכל לקיחה, גם באמצע ובסוף המשחק."],["החוקים שייכים להגנה בלבד","יד שנייה קטן, יד שלישית גבוה ותמונה מכסה תמונה חלים אך ורק על ההגנה. הכרוז רואה את שתי הידיים ועושה מה שנראה לו נכון."],["עיקר הדין: יד שלישית גבוה","השותף מוביל בקטן ובדומם קלפים קטנים - שמים את הקלף הגבוה ביותר, בלי יוצא מן הכלל. דוגמה: עם K 8 3 חייבים לשים את ה-K. ההובלה בקטן מראה סדרה ארוכה עם תמונה בראשה; ה-K מוציא מהכרוז את ה-A ומגביה את הסדרה. מי ששם 8 נותן לכרוז לקיחה זולה ב-10 - מתנה. ואין דבר כזה לשים קטן כדי לסמן לשותף שיש גבוה."],["בלי חכמות","גם עם K J שמים את ה-K ולא את ה-J, ועם A J שמים את ה-A: תמיד הגבוה ביותר, בלי לקחת בחשבון מה יודע או לא יודע השותף."],["הנמוך שעושה את העבודה","כששני קלפים מקיימים את החוק באותה מידה - שמים את הנמוך מביניהם. עם Q J שמים J: ה-Q תגיד לשותף שאין לך את ה-J - מידע שגוי שיכול להשפיע על כל ההגנה. באותו עיקרון: עם J 10 9 שמים 9. זהו הנמוך שעושה את העבודה - להקפיד עליו מאוד."],["כשרואים תמונה בדומם","עדיין יד שלישית גבוה, בלי הבדל. עם K J מול Q בדומם שמים J - ה-K וה-J עושים אותה עבודה מול המלכה. עם K J 9 מול Q בדומם שמים J; אם בדומם נמצאת גם ה-10 - הקלף הנכון הוא 9; ועם 9 8 שמים 8."],["מתי החוק מתבטל","שני מצבים: השותף מוביל בגבוה - A או K (ולפעמים גם Q, ראש רצף); או שהלקיחה כבר הוחלטה - אבודה מראש לטובת הדומם או לטובת השותף. בשני המצבים אין שום הגיון לשים גבוה, ובמקום זה מסמנים רוצה / לא רוצה."],["איך מסמנים: גבוה מעודד","קלף גבוה = מעוניין בהמשך, קלף נמוך = לא מעוניין. את השיטה האיטלקית (זוגי / אי-זוגי) משחקים רק בדיסקארדים, לא כאן. דוגמה: על הובלת A של השותף, עם Q 8 2 שמים 8 לעודד; עם 9 8 2 שמים 2. לפעמים אין קלף מתאים לעודד - סימונים אינם מושלמים, וזה בסדר."],["קריאת הקלף של יד שלישית","כשהשותף שם 10 והכרוז זכה ב-K - יודעים חד-משמעית שה-J אצל השותף (אחרת הכרוז היה זוכה בו), וממשיכים בסדרה בביטחון. כשהשותף שם J והכרוז זכה ב-K - ה-10 אצל הכרוז, ואסור להמשיך בסדרה כי זו מתנה. מנתחים את הקלף ויודעים - לא מקווים. הסימון עובד רק בזכות הנמוך שעושה את העבודה."],["גם J מספיק כדי לעודד","השותף מוביל בקטן ובדומם A K; עם J 7 2 מסמנים 7 - מעודד. רואים את ה-A וה-K בדומם, ולכן ההובלה בקטן מראה שה-Q אצל השותף - רוצים מאוד את ההמשך."],["סימון מרתיע וספירת נקודות","הובלת A של השותף וקלף נמוך ממך - מרתיע: ה-Q אצל הכרוז. סופרים נקודות לפי ההכרזה: אם השותף בוודאות יזכה ביד - לא ממשיכים בסדרה ויוצאים פסיבי; הכרוז ייאלץ לתת את היד לשותף, שישחק דרך הכרוז."],["סימון מעודד - ממשיכים בקטן, לא ב-K","עם A K J 6 4, הובלת A והשותף סימן מעודד (ה-Q אצלו) - לא ממשיכים ב-K: זו חסימה. ממשיכים בקטן אל ה-Q של השותף, והחזרה לוקחת את ה-K וה-J."]]},{id:"d3",icon:"🔽",name:"יד שנייה קטן",source:"8.mp4; 10.mp4",summary:[["מי נקרא יד שנייה","מי שמתחיל את הלקיחה הוא יד ראשונה, והבא אחריו הוא יד שנייה. מגן הוא יד שנייה כשהכרוז מתחיל את הלקיחה, מידו או מהדומם."],["הכלל: יד שנייה קטן","ברוב המצבים משחקים קלף קטן אחרי קלף קטן של הכרוז. הקלפים הגבוהים של ההגנה נועדו לאכול קלפים גבוהים של היריבים, ולא שני קלפים קטנים שלהם. עלייה מיותרת בתמונה יכולה להגביה צירוף תמונות אצל הכרוז והדומם."],["לא משחקים קלף ביניים כדי ״להוציא״ תמונה","אין לשחק 10 רק כדי לגרום לדומם לשחק תמונה: הכרוז היה משחק אותה ממילא. קלף הביניים של המגן חשוב בפני עצמו, ואיבודו עלול להפוך אחיזה כמו ⁦Q 9⁩ או ⁦K 9⁩ למקור לקיחה אצל הכרוז."],["אל תמהרו לזכות באס","עם ⁦A 10 5 3⁩ מול ⁦J 7 2⁩ בדומם, עלייה באס על קלף קטן אוכלת שני קלפים קטנים ונותנת לכרוז לקיחה. הפחד שהקלף הקטן של הכרוז הוא יחידון אינו סיבה: אם כך, המלך והמלכה החסרים אצל השותף."],["הכלל אינו איסור מוחלט","כשהקלף קונה לקיחה בזול מעל כל קלפי הדומם, למשל ⁦K 10 5⁩ מול ⁦9 7 3⁩, מותר לשחק 10. זה שונה ממצב שבו המלכה בדומם עדיין תעבור עליו."]]},{id:"d4",icon:"🎴",name:"תמונה מכסה תמונה",source:"8.mp4; 10.mp4",summary:[["כרוז שמשחק תמונה: תמונה מכסה תמונה","יד שנייה קטן מתייחס לכרוז שמשחק קטן. כרוז שמשחק תמונה - מקשיבים לחוק הכיסוי: תמונה מכסה תמונה. החוק חל כשהכרוז מוביל תמונה מידו הסגורה, או כשהדומם מוציא תמונה ואתם משחקים שנייים לפני הכרוז - גם כשרואים את האס לנגד העיניים."],["למה מכסים: הגבהת קלפי ביניים","כדי להגביה קלפי ביניים - J, 10 ולפעמים אפילו 9 ו-8, אצלכם או אצל השותף. אם על ה-Q תשימו קטן, גם הכרוז ישים קטן ויהיו לו שתי לקיחות בסדרה. אם תשימו את ה-K, הוא נאלץ להוציא את ה-A, וקלף הביניים מתגבה. שימו לב: לא מדויק שמכסים כדי להגביה לשותף - ההגבהה יכולה להיות גם ביד שלכם."],["מכסים גם כשה-A גלוי","גם כשברור שה-A אצל השותף, וגם כשה-A בדומם לעיניכם - מכסים. בלי כיסוי ה-Q זוכה בחינם, הכרוז חוזר לידו לעקיפה נוספת, וקלף ביניים בדומם מתגבה. עם ⁦A J⁩ בדומם הכיסוי ב-K מוציא את ה-A מיד ומגביה את ה-10 של השותף ללקיחה."],["יוצא מן הכלל: רצף מלא בדומם","כשבדומם נמצא רצף מלא - כמות הקלפים ברצף זהה לאורך הסדרה, כמו ⁦A J 10 9⁩ - כל קלפי הביניים כבר מוגבהים והסיבה היחידה לכסות לא קיימת. כיסוי נותן לכרוז את כל הלקיחות בסדרה; משחקים קטן. ברצף לא מלא, כמו ⁦A J 9⁩ בלי ה-10, חייבים לכסות: ה-10 עלול להיות אצל השותף."],["קודם מקשיבים לכלל","אל תחפשו את היוצא מן הכלל בכוח. קודם מקשיבים לכלל, כי ברוב המקרים הוא עובד; את היוצא מן הכלל מזהים רק כשרואים שהסיבה לכלל לא קיימת."]]}],Xe=[{id:"d1q1",topic:"d1",q:"⁦Q J 4 3⁩ נגד ⁦NT⁩: איזה קלף מובילים?",answer:"⁦3⁩",wrong:["⁦Q⁩","⁦J⁩","⁦4⁩"],expl:"נגד ⁦NT⁩ אין ⁦2½⁩ ולכן מובילים רביעי מלמעלה.",lat:!0},{id:"d1q2",topic:"d1",q:"⁦A K 7 6 4 2⁩ נגד ⁦NT⁩: איזה קלף מובילים?",answer:"⁦6⁩",wrong:["⁦A⁩","⁦K⁩","⁦2⁩"],expl:"נגד ⁦NT⁩ רביעי מלמעלה. (נגד חוזה צבע: האס.)",lat:!0},{id:"d1q3",topic:"d1",q:"⁦K J 10 6 2⁩ נגד ⁦NT⁩: איזה קלף מובילים?",answer:"⁦J⁩",wrong:["⁦K⁩","⁦10⁩","⁦6⁩"],expl:"רצף פנימי נחשב ⁦2½⁩, ההובלה נכונה אך מסוכנת.",lat:!0},{id:"d1q4",topic:"d1",q:"⁦A K 5 4 3 2⁩ נגד ⁦NT⁩: איזה קלף מובילים?",answer:"⁦4⁩",wrong:["⁦A⁩","⁦K⁩","⁦2⁩"],expl:"⁦A K⁩ בלבד אינו ⁦2½⁩. רביעי מלמעלה, לא האס.",lat:!0},{id:"d1q5",topic:"d1",q:"⁦Q J 4 3⁩ נגד חוזה צבע: איזה קלף מובילים?",answer:"⁦Q⁩",wrong:["⁦J⁩","⁦4⁩","⁦3⁩"],expl:"נגד חוזה צבע רצף של שניים מספיק.",lat:!0},{id:"d1q6",topic:"d1",q:"⁦A K 7 6 4 2⁩ נגד חוזה צבע: איזה קלף מובילים?",answer:"⁦A⁩",wrong:["⁦K⁩","⁦6⁩","⁦2⁩"],expl:"נגד חוזה צבע מובילים גבוה מהרצף.",lat:!0},{id:"d1q7",topic:"d1",q:"מה נדרש כדי להוביל מלך נגד ⁦NT⁩?",answer:"שלושה מכובדים רצופים, או ⁦2½⁩ (שני מכובדים סמוכים ועשיריה)",wrong:["שני מכובדים סמוכים בלבד","מלך בכל מקרה","כל צבע ארוך"],expl:"בלי ⁦2½⁩ מובילים רביעי מלמעלה.",lat:!1},{id:"d1q8",topic:"d1",q:"מה סדר העדיפויות בבחירת קלף ההובלה נגד ⁦NT⁩?",answer:"גבוה מרצף, אחר כך רביעי מלמעלה, אחר כך שני מלמעלה",wrong:["רביעי מלמעלה, גבוה מרצף, שני מלמעלה","שני מלמעלה, רביעי מלמעלה, גבוה מרצף","תמיד האס"],expl:"שני מלמעלה נדירה: מצבע ארוך בלי מכובד.",lat:!1},{id:"d1q9",topic:"d1",q:"מתי מובילים מדאבלטון נגד ⁦NT⁩?",answer:"רק אם השותף הציע את הצבע או שהיריבים הציעו את כל שאר הצבעים",wrong:["תמיד כשיש דאבלטון","כשיש מכובד בדאבלטון","אף פעם"],expl:"זה מפלט אחרון.",lat:!1},{id:"d1q10",topic:"d1",q:"הובלה מתחת לאס נגד חוזה צבע:",answer:"אסורה",wrong:["מומלצת","מותרת תמיד","תלויה במספר הקלפים"],expl:"נגד ⁦NT⁩ מותרת אך לא מומלצת.",lat:!1},{id:"d1q11",topic:"d1",q:"נגד 4♠. מה מובילים?",auction:[["דרום","1♠"],["מערב","P"],["צפון","2♦"],["מזרח","P"],["דרום","2NT"],["מערב","P"],["צפון","4♠"]],hand:["♠ Q 9 3","♥ K Q J 10 2","♦ 5","♣ K 4 3 2"],answer:"♥K",wrong:["♦5","♣3","♠3"],expl:"♥K מראש הרצף - הובלה אקטיבית שבונה לקיחות. הסינגלטון ♦5 הוא טעות דרסטית: סיכוי נמוך ש-♦A אצל השותף (יש לך 11 נקודות), וגם חיתוך היה מאבד את לקיחת השליט הטבעית (Q שלישית). הכלל: לא מובילים מקיצור עם שליטים טובים, ולא מובילים סינגלטון בעיוורון.",lat:!1,source:"lecture3"},{id:"d1q12",topic:"d1",q:"מה מובילים?",auction:[["מזרח","1♥"],["דרום","1♠"],["מערב","P"],["צפון","3♦","(ברגן)"],["דרום","4♠"]],hand:["♠ K 8 2","♥ 8 6 2","♦ 7 6","♣ 10 8 7 6 5"],answer:"♥6",wrong:["♥8","♥2","♣10"],expl:"הובלה בצבע השותף, אבל בקלף הנכון: משלושה קלפים בלי מכובד מובילים באמצעי (MUD) - 6. ה-8 יגיע בסיבוב הבא, וכך השותף ידע שיש לך שלושה ולא דאבלטון.",lat:!1,source:"lecture3"},{id:"d1q13",topic:"d1",q:"הובלת ♥6 בצבע השותף מ-8 6 2. הכרוז משחק קטן מהדומם, השותף זוכה ב-A♥ וממשיך ♥K. הדומם משחק קטן. מה אתה משליך?",answer:"♥8",wrong:["♥2","לא משנה, שני הקלפים שווים","תלוי בקלף שהכרוז שיחק"],expl:"♥8 - גבוה, מסמן שלושה קלפים. השלכת 2 תיקרא כדאבלטון; השותף ימשיך סיבוב שלישי וייתן לכרוז חיתוך והשלכה - חוזה שהיה אמור ליפול יבוצע. הובלות נכונות וסימון כמות הם הדברים החשובים בהגנה.",lat:!1,source:"lecture3"},{id:"d1q14",topic:"d1",q:"נגד חוזה בשליט, יש לך בסדרה K Q. מה מובילים מראש הרצף?",answer:"K",wrong:["Q","קלף קטן מתחת לרצף","אין די בשני מכובדים כדי להוביל מהרצף"],expl:"גבוה מרצף: נגד חוזה בשליט רצף של שני קלפים מספיק ומובילים במלך (נגד נו-טראמפ היו צריכים 3 מכובדים). רביעייה מלמעלה מתחת למלך היא ההובלה הכי פחות מומלצת.",lat:!1,source:"lecture3"},{id:"d1q15",topic:"d1",q:"נגד 4♠. מה מובילים?",hand:["♠ Q x x","♥ K J x","♦ A x x x x","♣ Q x"],answer:"♦A",wrong:["קטן ב-♦","קטן ב-♥","♣Q"],expl:'"אין ברירה": בשליט (Q שלישית) לא מובילים, ♥K J x מזלג, ♣Q x דאבלטון עם מכובד. מתחת לאס אסור בתכלית נגד שליט (עלולים לחתוך לך אותו). נשאר ♦A - הרע במיעוטו: עדיף אס בלי מלך מאשר קטן מתחת לאס.',lat:!1,source:"lecture3"},{id:"d1q16",topic:"d1",q:"נגד חוזה בשליט יש לך בסדרה A Q J 10 2. מה נכון?",answer:"בורחים מהסדרה ומחכים שאחרים ישחקו אותה",wrong:["מובילים ב-Q - גבוה מרצף פנימי","מובילים ב-A כדי לראות את הדומם","מובילים ב-2 - רביעייה מלמעלה"],expl:"רצף פנימי עם אס: נגד שליט לא מובילים בסדרה בכלל - זה שקול להובלה מתחת לאס. נגד נו-טראמפ דווקא אפשר להוביל ב-Q.",lat:!1,source:"lecture3"},{id:"d1q17",topic:"d1",q:"השותף הכריז ♥ ואתה רוצה להוביל אליו מ-8 2. במה מובילים?",answer:"♥8",wrong:["♥2","לא משנה - דאבלטון הוא דאבלטון","מחפשים סדרה אחרת תמיד"],expl:"תמיד גבוה מדאבלטון: מובילים 8 ובסיבוב הבא 2 - השותף רואה גבוה-נמוך ומזהה דאבלטון. גם מ-3 2 מובילים 3: כשה-2 יתגלה, ה-3 ייחשב גבוה. וגם עם תמונה בדאבלטון מובילים בתמונה.",lat:!1,source:"lecture3"},{id:"d1q18",topic:"d1",q:"אתה פותח סדרה חדשה באמצע המשחק עם 9 6 2 (בלי מכובד). מה ההובלה הנכונה, ומה זורקים כשהשותף ממשיך בסדרה?",answer:"מובילים 6, ואז זורקים 9",wrong:["מובילים 2, ואז זורקים 6","מובילים 9, ואז זורקים 6","מובילים 6, ואז זורקים 2"],expl:"MUD: מובילים באמצעי (6), ובסיבוב הבא זורקים את הגבוה (9) - השותף מבין שיש לך שלושה. אם תזרוק את ה-2, השותף יחשוב שיש לך דאבלטון וינסה לתת לך לחתוך.",lat:!1,source:"lecture3"},{id:"d1q19",topic:"d1",q:"השותף הכריז ♥, ויש לך מכובד ולפחות שלושה קלפים בסדרה. איזה קלף מובילים אליו?",answer:"הקלף הקטן ביותר",wrong:["המכובד","הקלף האמצעי","לא מובילים בצבע השותף עם מכובד"],expl:"בצבע השותף עם מכובד מובילים בקטן ביותר - כנגזרת של רביעייה מלמעלה.",lat:!1,source:"lecture3"},{id:"d1q20",topic:"d1",q:"מה סדר העדיפויות הכללי בהובלה נגד חוזה בשליט?",answer:"גבוה מרצף, סינגלטון, הובלה לשותף / רביעייה מלמעלה, דאבלטון",wrong:["סינגלטון תמיד ראשון, אחר כך גבוה מרצף","רביעייה מלמעלה ראשון, אחר כך גבוה מרצף","דאבלטון, הובלה לשותף, רביעייה מלמעלה, גבוה מרצף"],expl:"גבוה מרצף ראשון (ההובלה הטובה בברידג'), סינגלטון מיד אחריו (יכול להתחלף איתו לפי הדוגמה), אחר כך הובלה לשותף ורביעייה מלמעלה (מתחלפות ביניהן), ובסוף דאבלטון - הכי פחות מומלץ, במיוחד עם מכובד.",lat:!1,source:"lecture3"},{id:"d1q21",topic:"d1",q:"נגד 3NT. מה מובילים?",auction:[["צפון","1♥"],["מזרח","2♦"],["דרום","P"],["מערב","3NT"]],hand:["♠ A K 6","♥ A Q 8 5 3","♦ 10 4","♣ J 10 6"],answer:"♥5",wrong:["♠A","♦10","♣J"],expl:"הובלה מהסדרה הארוכה. ליריבים יחד כ-25 נקודות, ולשותף נשארו לכל היותר נקודה-שתיים - אי אפשר לצפות ממנו לעזרה. מנסים לפתח את ההארטים שלנו.",lat:!1,source:"lecture4"},{id:"d1q22",topic:"d1",q:"הובלת בהארט בקטן; השותף שיחק ♥10 (יד שלישית) והכרוז זכה ב-♥J. מה אפשר לתייג בוודאות?",answer:"לכרוז יש גם ♥K וגם ♥9",wrong:["לכרוז אין ♥K","לשותף יש ♥9","אי אפשר לדעת כלום לפני שהסיבוב מסתיים"],expl:"יד שלישית שמה גבוה, אבל את הנמוך מבין הקלפים שעושים אותה עבודה. אם לשותף היו K-10, היה חייב לשים K - ה-10 לא עושה אותה עבודה. אם היו לו 10-9, היה שם 9 - הנמוך מהרצף. לכן ה-J של הכרוז מתייג אצלו גם K וגם 9.",lat:!1,source:"lecture4"},{id:"d1q23",topic:"d1",q:"נגד 4♥ השותף הוביל ♣2. איזה קלף בוודאות אין לו?",answer:"♣A",wrong:["♣K","♣7","♣4"],expl:"בחוזה בשליט לא מובילים מתחת לאס - איסור מוחלט. אגב, שהכרוז שיחק את ה-A לא מוכיח שאין לו K-J: הוא מסתיר קלפים, וממשיכים לעקוב לפי המשחק.",lat:!1,source:"lecture4"},{id:"d1q24",topic:"d1",q:"בסדרה 9♦ 7♦ 6♦ 2♦, איזה קלף מובילים?",answer:"♦7",wrong:["♦2","♦9","♦6"],expl:"שני מלמעלה: בסדרה בלי מכובד לא מובילים רביעי מלמעלה. זו הובלה פסיבית ובטוחה - בכ-90% מהמקרים לא נותנת מתנה, לעומת כ-40% בלבד בהובלה מתחת למכובדים.",lat:!1,source:"lecture5"},{id:"d1q25",topic:"d1",q:"היריבים משחקים סלם, ויש לך תמונה בסדרה צדדית. מה נכון?",answer:"לא להוביל מתחת לתמונה",wrong:["להוביל מתחת לתמונה - אולי אמצא כוח אצל השותף","להוביל תמיד באס של הסדרה","להוביל בסינגלטון בכל מחיר"],expl:"נגד סלם רוב הנקודות אצל היריבים, וסיכויי ההצלחה של הובלה מסוכנת הולכים ופוחתים. הכלל הכללי: ככל שהיריבים משחקים חוזה גבוה יותר - מובילים פסיבי יותר; נגד ⁦2♠⁩ עם ניקוד מאוזן בין הצדדים דווקא מובילים אגרסיבי.",lat:!1,source:"lecture5"},{id:"d1q26",topic:"d1",q:"באיזו שיטת חישוב הובלה מסוכנת שיכולה להפיל את החוזה מתקבלת בברכה?",answer:"⁦IMP⁩",wrong:["טופ-בוטום","בשתיהן באותה מידה","תלוי רק בפגיעות"],expl:"ב-⁦IMP⁩ (ברומטר, תחרות קבוצות, אליפויות): במקרה הרע נתתם מתנה קטנה, ובמקרה הטוב הפלתם חוזה והרווחתם הרבה. בטופ-בוטום - השיטה שמשחקים ברוב התחרויות - מזהירים מהובלות אגרסיביות: אם היריב מבצע פלוס 1 או פלוס 2 בזכות ההובלה, הוא קיבל תוצאה גבוהה מאוד.",lat:!1,source:"lecture5"},{id:"d1q27",topic:"d1",q:"מהי הובלת השליט ה״מותרת״ ביותר, כשאין לך הובלה טובה אחרת?",answer:"משני קטנים או משלושה קטנים (האמצעי)",wrong:["מסינגלטון שליט","מ-Q x x","מארבעה שליטים"],expl:"עם Q-x-x המלכה הייתה זוכה בעצמה ובוודאות תלך לאיבוד - אסור. גם K דאבלטון אסור, ומתחת למלכה או מלך - אסור בכלל. עם ארבעה שליטים לא מובילים, וסינגלטון שליט חושף לכרוז את המצב ועוקר לשותף שן. עם A שליט - אפשרי אבל לא מומלץ. נשארים שני או שלושה קטנים.",lat:!1,source:"lecture5"},{id:"d1q28",topic:"d1",q:"למה אסור להוביל בסינגלטון שליט?",answer:"סביר שלשותף רביעייה עם מכובד, וההובלה חושפת לכרוז את המצב ועוקרת לשותף שן",wrong:["כי זה נוגד את חוקי המשחק","כי תמיד מאבדים לקיחה מיד בהובלה כזו","כי סינגלטון בשליט מלווה תמיד בדאבלטון אצל השותף"],expl:"כשיש לך סינגלטון בשליט, חלוקת השליטים אצל היריבים אינה מאוזנת - וסביר מאוד שלשותף רביעייה. אם אצלו Q-x-x-x או J-x-x-x, הוא מצפה שהכרוז יתקל בהפתעה; ההובלה שלך חושפת לכרוז את כל המצב ומוציאה לשותף את ״השן״. מעדיפים שהכרוז יתמודד עם סדרת השליט בעצמו.",lat:!1,source:"lecture5"},{id:"d1q29",topic:"d1",q:"נגד ⁦4♠⁩ יש לך סינגלטון ⁦♥7⁩ ושליטים Q♠ 10♠ 9♠ 2♠. מה נכון?",answer:"לא להוביל בסינגלטון - השליטים שלי טובים והחיתוך יפגע בי",wrong:["להוביל בסינגלטון - תמיד מובילים בסינגלטון נגד חוזה בשליט","להוביל ב-♠2 - שליט קטן תמיד בטוח","להוביל בסינגלטון רק אם השותף הכריז הארט"],expl:"עם שליטים טובים לא מובילים בקוצר: ארבעה שליטים, שלושה שליטים טובים או סטופר בשליט - החיתוך יפגע בכם בוודאות, כי השליטים האלה היו זוכים ממילא. עם שליטים קטנים דווקא מומלץ להוביל בקוצר. וזכרו: הובלת קוצר שלא הבשילה לחיתוך - לרוב פגעתם בעצמכם.",lat:!1,source:"lecture5"},{id:"d1q30",topic:"d1",q:"מתי מובילים מתמונה דאבלטון (למשל ⁦♥Q x⁩)?",answer:"כמעט אף פעם - רק אם השותף הכריז את הסדרה",wrong:["תמיד - כך משתחררים מהתמונה","רק נגד חוזה בלי שליט","רק כשליד התמונה יש גם את ה-A"],expl:"הסיכוי לתת מתנה בהובלה מתמונה דאבלטון גבוה מאוד: מ-Q דאבלטון או J דאבלטון לא מובילים, אלא אם השותף הכריז את הצבע. ובכלל - הובלה בדאבלטון כמה שפחות; סיכויי ההצלחה נמוכים מאוד.",lat:!1,source:"lecture5"},{id:"d1q31",topic:"d1",q:"נגד ⁦4♠⁩ של דרום. מה מובילים?",auction:[["דרום","2NT"],["מערב","P"],["צפון","3♣","(פאפיט סטיימן)"],["מזרח","P"],["דרום","3♠"],["מערב","P"],["צפון","4♠"]],hand:["♠ 8 7","♥ K J 7 5 3","♦ A 5","♣ A J 3 2"],answer:"♠8",wrong:["♥5","♦A","♣J"],expl:"הובלה פסיבית בשליט קטן. יש לך 13 נקודות - מתחילים לספור נקודות בהובלה! - ולכן לשותף לא נשאר כמעט כלום. ♥5 נותנת לכרוז את ה-Q והופכת את החוזה למבוצע; ♦A, בלי סיכוי שהשותף יזכה ביד וייתן חיתוך, מגביהה ליריבים את הדיימונדים. ההובלה הפסיבית משאירה לכרוז ארבעה לוזרים (שני הארטים, דיימונד וקלאב) - והוא נופל מינוס 1.",lat:!1,source:"lecture5"},{id:"d1q32",topic:"d1",q:"נגד ⁦4♠⁩ של דרום. מה מובילים?",auction:[["דרום","1♠"],["מערב","P"],["צפון","2♦"],["מזרח","P"],["דרום","2NT"],["מערב","P"],["צפון","4♠"]],hand:["♠ 8 7 2","♥ K J 7 5 3","♦ 5 4","♣ J 3 2"],answer:"♥5",wrong:["♠8","♦5","♣J"],expl:"הפעם רק 5 נקודות - הגיוני מאוד למצוא את ה-A אצל השותף, ולכן ההובלה האגרסיבית בהארט נכונה, באותה סדרת K J 7 5 3 בדיוק שהייתה אסורה עם יד חזקה. ההגנה מצאה את ♥A אצל השותף, לקחה שלוש לקיחות הארט ואת ♣A (אחרי סימון מעודד של השותף) - ארבע לקיחות והחוזה נפל.",lat:!1,source:"lecture5"},{id:"d1q33",topic:"d1",q:"נגד ⁦3NT⁩ של דרום. מה מובילים?",auction:[["דרום","2NT"],["מערב","P"],["צפון","3NT"]],hand:["♠ K J 10 6 4","♥ Q 7 6","♦ J 9 2","♣ 9 8"],answer:"♠J",wrong:["♠4","♥6","♦J"],expl:"גבוה מרצף פנימי: ה-J-10 עם התמיכה של ה-K מלמעלה נחשב רצף של ⁦2½⁩ מלמעלה - ה-⁦2½⁩ מגיע מלמעלה ולא מלמטה - ולכן מובילים ב-J ולא בקטן. זו ההובלה היחידה שמפילה את החוזה: אם הדומם שם את ה-Q - השותף לוקח את ה-A ומחזיר; אם הדומם משחק קטן - ה-J זוכה וממשיכים בקטן אל ה-A. בהובלה ב-4 ה-Q בדומם הופכת לעוצר והחוזה מבוצע.",lat:!1,source:"lecture5"},{id:"d2q4",topic:"d1",q:"נגד ⁦3NT⁩ של דרום. מה מובילים?",auction:[["דרום","1NT"],["מערב","P"],["צפון","3NT"]],hand:["♠ Q 8 5 3 2","♥ J 8 7","♦ A K 2","♣ 6 5"],answer:"♠3",wrong:["♦A","♥7","♣5"],expl:"הובלה בסדרה הארוכה, ולפי ההכרזה (היריבים דיברו רק נוטראמפ) משתדלים להוביל במייג'ור. ♦A מסדרה קצרה היא הובלה לא נכונה נגד נוטראמפ. הכרוז חייב להגביה דיימונדים כדי לבצע - וכשנזכה ב-♦K נמשיך בספייד.",lat:!1,source:"lecture6"},{id:"d2q1",topic:"d2",q:"השותף מוביל בקטן ובדומם קלפים קטנים. לך Q J. מה משחקים ביד השלישית?",answer:"ה-J",wrong:["ה-Q","לא משנה - שני הקלפים מקיימים את החוק","קלף נמוך כדי לסמן גבוה"],expl:"הנמוך שעושה את העבודה: שני הקלפים מקיימים את יד שלישית גבוה, אבל אם תשים את ה-Q תגיד לשותף שאין לך את ה-J - מידע שגוי. כששמים J ייתכן שיש לך Q וייתכן שלא. באותו עיקרון: עם J 10 9 שמים 9, שאומר שאין לך 8.",lat:!1,source:"lecture6"},{id:"d2q2",topic:"d2",q:"לך K J 9. השותף מוביל ב-2, בדומם נמצאת ה-Q, והכרוז משחק 4. מה שמים?",answer:"ה-J",wrong:["ה-K","ה-9","תלוי במה יש לשותף"],expl:"ה-9 לא מקיים יד שלישית גבוה (הכרוז יכול לזכות זול עם 10). נשארים K ו-J - ומול ה-Q בדומם הם עושים אותה עבודה, ולכן לא מבזבזים את ה-K. אם בדומם הייתה נמצאת גם ה-10 - הקלף הנכון הוא 9, ועם 9 8 שמים 8.",lat:!1,source:"lecture6"},{id:"d2q3",topic:"d2",q:"מהם שני המצבים שבהם לא הגיוני לשים יד שלישית גבוה?",answer:"השותף מוביל בגבוה (A או K, לפעמים Q מראש רצף), או שהלקיחה כבר הוחלטה",wrong:["כשיש לך רק קלפים קטנים, או כשהחוזה בנוטראמפ","כשיש תמונה בדומם, או כשהשותף מוביל בקטן","כשהכרוז שם גבוה מהדומם, או כשאתה מוביל"],expl:"בשני המצבים האלה החוק מתבטל ובמקום לשים גבוה מסמנים רוצה / לא רוצה: קלף גבוה מעודד, קלף נמוך מרתיע. את השיטה האיטלקית (זוגי / אי-זוגי) משחקים רק בדיסקארדים.",lat:!1,source:"lecture6"},{id:"d2q5",topic:"d2",q:"נגד ⁦3NT⁩: הובלת ⁦3♠⁩, השותף שיחק את ה-10 והכרוז זכה ב-K. היכן נמצא ה-J?",answer:"אצל השותף",wrong:["אצל הכרוז","אי אפשר לדעת","עדיין בדומם"],expl:"אם ה-J היה אצל הכרוז, הוא היה זוכה בו ולא ב-K. המידע הזה זמין רק בזכות שהשותף שיחק את הנמוך שעושה את העבודה (10 מ-J 10 6). לכן כשנזכה ביד ממשיכים בספייד אל ה-J של השותף, מגביהים את הסדרה ומפילים את החוזה.",lat:!1,source:"lecture6"},{id:"d2q6",topic:"d2",q:"נגד ⁦3NT⁩: הובלת ⁦3♠⁩, השותף שיחק את ה-J והכרוז זכה ב-K. היכן ה-10, ומה המסקנה?",answer:"אצל הכרוז - אסור להמשיך בספייד",wrong:["אצל השותף - ממשיכים בספייד","אצל הכרוז - דווקא ממשיכים בספייד","אי אפשר לדעת"],expl:"השותף שיחק את הגבוה שלו - אין לו את ה-10. אם נמשיך בספייד ניתן לכרוז לקיחה זולה ב-10, מתנה לא מחויבת. מהקלף שהיד השלישית שיחקה מנתחים את כל הסדרה - אלה הסימונים החשובים ביותר במשחק.",lat:!1,source:"lecture6"},{id:"d2q7",topic:"d2",q:"השותף מוביל בספייד קטן, בדומם A♠ K♠ 3♠ ולך J♠ 7♠ 2♠. הכרוז משחק את ה-A מהדומם. האם ה-J מספיק כדי לעודד?",answer:"כן - מסמנים 7, מעודד",wrong:["לא - בלי Q אין סיבה לעודד, שמים 2","כן - שמים את ה-J עצמו כדי לעודד","לא - תמיד שמים את הנמוך ביותר"],expl:"ודאי שכן. רואים A K בדומם, כך שההובלה בקטן של השותף מראה שה-Q אצלו. יד שלישית גבוה מתבטל כאן (הלקיחה הוחלטה לטובת הדומם), ולכן מסמנים רוצה / לא רוצה - וה-7 מעודד בלי לבזבז את ה-J.",lat:!1,source:"lecture6"},{id:"d2q8",topic:"d2",q:"נגד ⁦3NT⁩ (הכרזה: ⁦1NT - 2NT - 3NT⁩): הובלת ⁦A♠⁩ והשותף שם 2. מה ידוע לך, ואיך ממשיכים?",answer:"ה-♠Q בדרום; יוצאים פסיבי - השותף יזכה ביד וישחק ספייד דרך הכרוז",wrong:["ה-♠Q אצל השותף; ממשיכים ב-♠K","לא יודעים דבר; ממשיכים ב-♠K כדי לבדוק","ה-♠Q בדרום; ממשיכים ב-♠K כדי להוציא אותה מיד"],expl:"ה-2 מרתיע - ה-♠Q בדרום, והמשך בספייד יגביה אותה. יש לך 9 נקודות, וההכרזה מסגירה את היריבים על 25-26 נקודות לכל היותר - השותף בוודאות יזכה ביד. יוצאים פסיבי (הארט בטוח: רצף K Q J 10 בדומם), הכרוז חייב להגביה דיימונדים ונותן את היד לשותף - שמשחק ספייד דרך הכרוז. חמש לקיחות.",lat:!1,source:"lecture6"},{id:"d2q9",topic:"d2",q:"נגד ⁦3NT⁩: הובלת ⁦A♠⁩ מ-⁦A K J 6 4⁩, והשותף שם 7 (מעודד). איך ממשיכים?",answer:"בספייד קטן אל ה-Q של השותף",wrong:["ב-♠K ואז ב-♠J","עוברים לסדרה אחרת","ב-♠J כדי לשמור על הובלה"],expl:"ה-7 מעודד - ה-Q אצל השותף. המשך ב-K חוסם את הסדרה: נשארים לך J 6 4 בלי כניסה מהירה נוספת. ממשיכים בקטן, השותף זוכה ב-Q ומחזיר אל ה-K וה-J - חמש לקיחות ספייד מהירות ו-3NT מינוס 1.",lat:!1,source:"lecture6"},{id:"d2q10",topic:"d2",q:"דרום משחק ⁦4♥⁩. מערב מוביל ⁦3♠⁩, בדומם Q♠ 7♠ 2♠ והכרוז מבקש ⁦2♠⁩. אתם במזרח עם A♠ J♠ 4♠. בהנחה שהובלה בקטן מראה תמונה, איזה קלף תשחקו?",answer:"⁦J♠⁩",wrong:["⁦A♠⁩","⁦4♠⁩","אי אפשר להחליט בלי לראות את כל יד השותף"],expl:"ההובלה הקטנה מראה תמונה. האס והנסיך אצלכם והמלכה בדומם, ולכן המלך אצל השותף. הנסיך עושה את העבודה בלי לבזבז את האס. אילו החזקתם גם ב-10, היה צריך לשחק 10: הנמוך שעושה את העבודה.",lat:!1,source:"lecture7",distractors:"suggested"},{id:"d2q11",topic:"d2",q:"דרום משחק ⁦4♥⁩. מערב מוביל ⁦4♠⁩, בדומם Q♠ 7♠ 2♠ ומשוחק ⁦2♠⁩. אתם במזרח עם K♠ 10♠ 3♠. הובלה בקטן מראה תמונה, והשותף אינו מוביל מתחת לאס נגד שליט. מה תשחקו?",answer:"⁦10♠⁩",wrong:["⁦K♠⁩","⁦3♠⁩","אי אפשר להחליט בלי לראות את כל יד השותף"],expl:"האס אצל הכרוז והנסיך אצל השותף. ה-10 מוציא את האס ושומר את המלך מול המלכה בדומם. משחק המלך מפסיד לאס ומגביה את המלכה לכרוז. אין כאן היתר לשחק כל קלף בינוני: עם 9 במקום 10 צריך לשחק מלך.",lat:!1,source:"lecture7",distractors:"suggested"},{id:"d2q12",topic:"d2",q:"דרום משחק ⁦4♥⁩. השותף מוביל מלך בסדרה צדדית, בדומם ⁦7 6 4⁩ בסדרה והדומם משחק קטן. אצלכם ⁦A 2⁩ באותה סדרה. מה תשחקו ביד השלישית?",answer:"⁦A⁩, ואחריו חוזרים ב-2",wrong:["2, כדי לשמור את האס לסיבוב הבא","2, כי על קלף גבוה של השותף תמיד מסמנים","אי אפשר להחליט אם לשחרר את האס בלי לדעת אם לשותף ⁦KQJ⁩ או רק ⁦KQ⁩"],expl:"משחררים את האס מיד ומחזירים ב-2 ליד הארוכה כדי למנוע חסימה. עם ⁦KQJ⁩ אצל השותף גובים את הלקיחות. אם לשותף רק ⁦KQ⁩, הוא יכול להמשיך בסיבוב שלישי לחיתוך שלכם.",lat:!1,source:"lecture7",distractors:"suggested"},{id:"d2q13",topic:"d2",q:"דרום משחק ⁦3NT⁩. השותף מוביל מלך, בדומם ⁦7 6 4⁩ בסדרה והדומם משחק קטן. אצלכם ⁦A 2⁩ באותה סדרה. השותף מוביל מלך מרצף חזק כגון ⁦KQJ⁩ או ⁦KQ10⁩. מה תשחקו?",answer:"⁦A⁩, ואחריו חוזרים ב-2",wrong:["2, כי ללא שליט אין חיתוך ולכן לא משחררים את האס","2, כדי לשמור כניסה מאוחרת באס","⁦A⁩, אך אם הוא זוכה עוברים לסדרה אחרת במקום לחזור ב-2"],expl:"גם ללא שליט משחררים את האס ומחזירים ב-2 כדי לא לחסום את הסדרה. סומכים על הובלת מלך מרצף חזק מספיק, כגון ⁦KQJ⁩ או ⁦KQ10⁩. היעדר אפשרות לחתוך אינו סיבה לחסום: הוא הסיבה שהובלת המלך צריכה להיות חזקה יותר מלכתחילה.",lat:!1,source:"lecture7",distractors:"suggested"},{id:"d2q14",topic:"d2",q:"דרום משחק ⁦3NT⁩. מערב מוביל ⁦Q♠⁩, בדומם 8♠ 7♠ 4♠ ומשוחק קטן. אתם במזרח עם K♠ 3♠. מה תשחקו ביד השלישית?",answer:"⁦K♠⁩",wrong:["⁦3♠⁩, כדי לשמור את המלך לסיבוב הבא"],expl:"משחררים את המלך כדי שלא יישאר בודד ויחסום את הסדרה. כשהשותף מחזיק Q♠ J♠ 10♠ 6♠ 2♠ וכניסה מאוחרת ב-⁦A♥⁩, השחרור מאפשר לגבות את הספיידים בהמשך. אם המלך זוכה מחזירים ⁦3♠⁩. אם הכרוז זוכה מיד באס, החסימה כבר הוסרה. שמירת המלך מאפשרת לכרוז לנצל את החסימה, גם באמצעות עיכוב האס.",lat:!1,source:"lecture7",distractors:"suggested"},{id:"d3q1",topic:"d3",q:"הכרוז משחק ⁦2♦⁩ ומוביל קלף קטן מידו. בדומם, שיושב אחריכם, Q♦ 7♦ 3♦. אתם ביד שנייה עם K♦ 10♦ 5♦. אין לכם מידע מיוחד מההכרזה ואין סיבה לחרוג מהכלל. מה תשחקו?",answer:"⁦5♦⁩",wrong:["⁦10♦⁩, כדי לגרום לדומם לשחק את המלכה","⁦K♦⁩, כדי לאכול את המלכה"],expl:"משחקים קטן. ה-10 אינו גורם למלכה לצאת: הכרוז ישחק אותה ממילא. המלך וה-10 נשמרים כדי לאכול קלפים גבוהים בהמשך. אם לכרוז ⁦J 9 2⁩ ולשותף ⁦A 8 x⁩, קטן מאפשר למלכה לצאת ולהילקח באס, והמלך וה-10 נשארים מול הנסיך וה-9. מלך על הקלף הקטן אוכל שני קטנים ונותן לנסיך ולמלכה לקיחה. 10 מגביה את ה-9 כי הקלף שהיה מונע זאת בוזבז.",lat:!1,source:"lecture8",distractors:"suggested"},{id:"d3q2",topic:"d3",q:"דרום משחק ⁦4♠⁩. אחרי הוצאת שליטים הכרוז מוביל ⁦4♣⁩ מידו. בדומם, שיושב אחריכם, J♣ 7♣ 2♣. אתם בצפון עם A♣ 10♣ 5♣ 3♣. מה תשחקו?",answer:"⁦3♣⁩, קלף קטן",wrong:["⁦10♣⁩, כדי להוציא את הנסיך מהדומם","⁦A♣⁩, מחשש שה-4 הוא יחידון"],expl:"משחקים קטן. ה-10 נותן לכרוז לקיחה: אם לשותף המלך, הנסיך מהדומם נלקח בו, המלכה מוציאה את האס, וה-9 מוגבה כי ה-10 בוזבז. גם אס מיד אוכל שני קלפים קטנים. הפחד שה-4 הוא יחידון אינו סיבה לבזבז את האס: אם כך, המלך והמלכה החסרים נמצאים אצל השותף. בדוגמה עם ⁦K 8 6⁩ אצל השותף ו-⁦Q 9 4⁩ אצל הכרוז, האס נשמר מעל המלכה וה-10 מעל ה-9, וההגנה מקבלת שלוש לקיחות בסדרה.",lat:!1,source:"lecture8",distractors:"suggested"},{id:"d3q3",topic:"d4",q:"מה המטרה של כיסוי תמונה בתמונה?",answer:"להגביה קלפי ביניים - J, 10 ולפעמים 9 ו-8, אצלכם או אצל השותף",wrong:["להגביה קלפים אצל השותף בלבד","לזכות מיד בלקיחה עם הקלף המכסה","למנוע מהכרוז לחזור לידו"],expl:"אם על ה-Q תשימו קטן, גם הכרוז ישים קטן ויהיו לו שתי לקיחות בסדרה. אם תשימו את ה-K, הוא נאלץ להוציא את ה-A, וקלף הביניים אצלכם או אצל השותף מתגבה. לא מדויק שמכסים כדי להגביה לשותף - ההגבהה יכולה להיות גם ביד שלכם.",lat:!1,source:"lecture10",distractors:"suggested"},{id:"d3q4",topic:"d4",q:"הכרוז משחק את ה-⁦Q♥⁩ מהיד. בדומם ⁦J♥ 7♥ 6♥ 3♥⁩ ואתם ביד שנייה עם ⁦K♥ 9♥ 5♥⁩. ידוע שה-⁦A♥⁩ אצל השותף. מה תשחקו?",answer:"⁦K♥⁩ - מכסים תמונה בתמונה",wrong:["קלף קטן - ה-A אצל השותף ויזכה בכל מקרה","קלף קטן - יד שנייה תמיד משחקת קטן","⁦9♥⁩ - כדי לשמור את ה-K מעל ה-Q"],expl:"מכסים. בלי כיסוי הכרוז חוזר לידו ועושה עקיפה חיצונית: בין אם תשימו את ה-K ובין אם לאו, ה-J בדומם מתגבה, והכרוז מתפטר ממפסיד בגלל הטעות. עם הכיסוי נשארים לו שלושה מפסידים בסדרה והחוזה נופל. קודם מקשיבים לכלל, כי ברוב המקרים הוא עובד.",lat:!1,source:"lecture10",distractors:"suggested"},{id:"d3q5",topic:"d4",q:"הכרוז משחק את ה-⁦Q♥⁩ מהיד. בדומם ⁦A♥ 7♥ 6♥ 3♥⁩ ואתם ביד שנייה עם ⁦K♥ 9♥ 8♥ 5♥⁩. מה תשחקו?",answer:"⁦K♥⁩ - מכסים גם כשה-A בדומם",wrong:["קלף קטן - אין טעם לכסות כשה-A בדומם","קלף קטן - שומרים את ה-K לסיבוב הבא","⁦5♥⁩ - ה-Q ממילא תפסיד ל-A בסיבוב הבא"],expl:"הכיסוי מאלץ את ה-A לצאת מיד, והכרוז נשאר עם שני מפסידים בסדרה לעולמי עד. בלי כיסוי גם ה-Q זוכה וגם ה-A בדומם זוכה - והמפסידים של הכרוז יורדים משניים לאחד.",lat:!1,source:"lecture10",distractors:"suggested"},{id:"d3q6",topic:"d4",q:"הכרוז משחק את ה-⁦Q♥⁩ מהיד. בדומם ⁦A♥ J♥ 6♥⁩ ואתם ביד שנייה עם ⁦K♥ 7♥ 5♥⁩. מה תשחקו?",answer:"⁦K♥⁩ - מכסים, וה-10 של השותף מתגבה",wrong:["קלף קטן - מול ⁦A J⁩ בדומם הכיסוי לא משנה","קלף קטן - שומרים את ה-K מעל ה-J","⁦7♥⁩ - ה-J בדומם יזכה בכל מקרה"],expl:"חייבים לכסות. בלי כיסוי ה-Q זוכה, ואז עקיפה על ה-K: אין לכרוז מפסיד בסדרה בכלל. עם הכיסוי ה-A נאלץ לצאת וה-10 של השותף מתגבה ללקיחה - הכרוז נשאר עם מפסיד אחד, בדיוק כפי שההגנה צריכה.",lat:!1,source:"lecture10",distractors:"suggested"},{id:"d3q7",topic:"d4",q:"הכרוז משחק את ה-⁦Q♥⁩ מהיד. בדומם ⁦A♥ J♥ 10♥ 9♥⁩ ואתם ביד שנייה עם ⁦K♥ 7♥ 5♥ 2♥⁩. מה תשחקו?",answer:"קלף קטן - לא מכסים רצף מלא",wrong:["⁦K♥⁩ - תמונה מכסה תמונה תמיד"],expl:"זה היוצא מן הכלל. רצף מלא - כמות הקלפים ברצף זהה לאורך הסדרה - אומר שכל קלפי הביניים כבר מוגבהים בדומם, והסיבה היחידה לכסות לא קיימת. כיסוי נותן לכרוז את כל ארבע הלקיחות בסדרה. משחקים קטן: ה-Q זוכה, וגם עקיפה נוספת על ה-K מצליחה, אבל לכרוז אין קלף שלישי לצאת איתו לעקיפה וה-J לעולם לא יתגבה.",lat:!1,source:"lecture10",distractors:"suggested"},{id:"d3q8",topic:"d4",q:"הכרוז משחק את ה-⁦Q♥⁩ מהיד. בדומם ⁦A♥ J♥ 9♥⁩ ואתם ביד שנייה עם ⁦K♥ 7♥ 5♥⁩. מה תשחקו?",answer:"⁦K♥⁩ - מכסים, הרצף אינו מלא",wrong:["קלף קטן - כמו ברצף מלא, לא מכסים מול ⁦A J⁩ בדומם","קלף קטן - ה-10 חסר ואין מה להגביה","⁦7♥⁩ - מחכים לראות איפה ה-10 לפני שמכסים"],expl:"חייבים לכסות. הרצף אינו מלא כי ה-10 חסר, והוא עלול להיות אצל השותף - מכסים כדי לנסות להגביה קלף ביניים. רק כשרואים שכל קלפי הביניים בדומם מוגבהים ממילא, כלומר רצף מלא, משאירים את ה-K ביד.",lat:!1,source:"lecture10",distractors:"suggested"},{id:"d2q15",hand:["♠ 9","♥ Q 10 9 3","♦ K J 10","♣ K 7 5 4 3"],q:"מערב משחק ⁦6♠⁩. אתם בדרום. צפון מוביל ⁦8♣⁩. בדומם במזרח: ⁦♠ Q6543 · ♥ AJ · ♦ 32 · ♣ 10962⁩. הדומם משחק ⁦2♣⁩. מה תשחקו?",answer:"⁦3♣⁩ - שומרים את המלך",wrong:["⁦K♣⁩ - יד שלישית גבוהה בכל מצב","⁦7♣⁩ - כדי להוציא את האס של הכרוז"],expl:"מנתחים את ההובלה ולא משחקים גבוה אוטומטית. כשה-10 וה-9 גלויים בדומם, ה-8 אינו רביעי מלמעלה. לפי שיטת ההובלות, צפון גם לא הוביל מתחת לתמונה בחוזה צבע: ה-8 הוא הגבוה שלו. לכן ⁦A♣ Q♣ J♣⁩ אצל הכרוז. אין טעם להקריב את ⁦K♣⁩ תחת האס. שמירת המלך מגבילה את הכרוז לשלוש לקיחות בקלאב, במקום ארבע.",topic:"d2",lat:!1,source:"lecture12",distractors:"suggested"},{id:"d2q16",hand:["♠ 9","♥ Q 10 9 3","♦ K J 10","♣ K 7 5 4 3"],q:"מערב משחק ⁦6♠⁩. אתם בדרום. צפון מוביל ⁦8♣⁩. בדומם במזרח: ⁦♠ Q6543 · ♥ AJ · ♦ 32 · ♣ 10962⁩. הדומם משחק ⁦10♣⁩. האם תכסו במלך?",answer:"⁦3♣⁩ - לא מכסים במלך",wrong:["⁦K♣⁩ - מכסים את ה-10 בתמונה","⁦7♣⁩ - כדי לעודד המשך בקלאב"],expl:"אותו ניתוח הובלה תקף גם כשהדומם משחק 10: לשותף אין תמונה בקלאב, והאס, המלכה והנסיך אצל הכרוז. משחק ⁦K♣⁩ יגביה את ה-10 שבדומם וייתן לכרוז ארבע לקיחות בקלאב להשלכת מפסיד. שומרים את המלך, גם אם הכרוז יוכל לעקוף בהמשך, ומגבילים אותו לשלוש לקיחות בסדרה.",topic:"d2",lat:!1,source:"lecture12",distractors:"suggested"},{id:"d2q17",hand:["♠ 8 7","♥ Q 10 8 4","♦ J 9 2","♣ A 8 7 4"],auction:[["מערב","1NT","15-17, מאוזנת"],["צפון","P"],["מזרח","2♣","סטיימן"],["דרום","P"],["מערב","2♠"],["צפון","P"],["מזרח","3♠","הזמנה"],["דרום","P"],["מערב","4♠"],["צפון","P"],["מזרח","P"],["דרום","P"]],q:"מערב משחק ⁦4♠⁩ אחרי ההכרזה המוצגת. אתם בדרום. בדומם במזרח: ⁦♠ QJ106 · ♥ J62 · ♦ K76 · ♣ Q93⁩. צפון מוביל ⁦10♣⁩. הדומם משחק ⁦3♣⁩. האם תזכו באס ותחזירו קלאב?",answer:"⁦8♣⁩ לעידוד - מעכבים את האס",wrong:["⁦A♣⁩ ומיד קלאב לחיתוך","⁦4♣⁩ כדי לבקש מהשותף לעבור לסדרה אחרת"],expl:"ה-9 בקלאב גלוי בדומם ולכן ה-10 המוביל אינו ראש רצף. משלבים את הקוצר עם ההכרזה המאוזנת של מערב וארבעת הספיידים שהראה: לצפון דאבלטון בקלאב, לא סינגלטון. אם תזכו באס ותחזירו מיד קלאב, השותף רק ישרת והקשר ינותק. משחקים 8 לעידוד ושומרים את האס ככניסה. אם השותף יזכה בשליט, יחזור בקלאב הנותר אל האס שלכם ויקבל קלאב לחיתוך.",topic:"d2",lat:!1,source:"lecture12",distractors:"suggested"},{id:"d2q18",hand:["♠ 8 7","♥ Q 10 8 4","♦ J 9 2","♣ A 8 7 4"],auction:[["מערב","1NT","15-17, מאוזנת"],["צפון","P"],["מזרח","2♣","סטיימן"],["דרום","P"],["מערב","2♠"],["צפון","P"],["מזרח","3♠","הזמנה"],["דרום","P"],["מערב","4♠"],["צפון","P"],["מזרח","P"],["דרום","P"]],q:"מערב משחק ⁦4♠⁩ אחרי ההכרזה המוצגת. אתם בדרום. בדומם במזרח: ⁦♠ QJ106 · ♥ J62 · ♦ K76 · ♣ Q93⁩. צפון מוביל ⁦10♣⁩. הדומם משחק ⁦Q♣⁩. מה תשחקו?",answer:"⁦8♣⁩ - שומרים את האס ככניסה",wrong:["⁦A♣⁩ - חייבים לכסות את המלכה","⁦4♣⁩ כדי לבקש מעבר להארט"],expl:"גם מול המלכה מעכבים את ⁦A♣⁩. לשותף דאבלטון בקלאב. זכייה באס והחזרת קלאב מיד ישאירו אותו בלי קלאב לחזור בו אליכם אחרי זכייה בשליט. שומרים את האס: כשצפון יזכה ב-⁦A♠⁩ ויחזור בקלאב שנותר לו, תזכו באס ותתנו לו חיתוך. משחק ה-8 מעודד את השותף להמשיך בקלאב.",topic:"d2",lat:!1,source:"lecture12",distractors:"suggested"},{id:"d2q19",hand:["♠ 8 7","♥ Q 10 8 4","♦ J 9 2","♣ A 8 7 4"],auction:[["מערב","1NT","15-17, מאוזנת"],["צפון","P"],["מזרח","2♣","סטיימן"],["דרום","P"],["מערב","2♠"],["צפון","P"],["מזרח","3♠","הזמנה"],["דרום","P"],["מערב","4♠"],["צפון","P"],["מזרח","P"],["דרום","P"]],q:"מערב משחק ⁦4♠⁩ אחרי ההכרזה המוצגת. אתם בדרום. בדומם במזרח: ⁦♠ QJ106 · ♥ J62 · ♦ K76 · ♣ Q93⁩. צפון מוביל ⁦10♣⁩. איך מסיקים שהשותף התחיל בדאבלטון בקלאב ולא בסינגלטון?",answer:"מההכרזה ומספירת הקלאבים",wrong:["הובלת 10 לבדה מבטיחה דאבלטון","ארבעה קלאבים אצלנו לבדם מוכיחים זאת","הזמנת 3♠ לבדה מוכיחה דאבלטון"],expl:"לכם ארבעה קלאבים ולדומם שלושה, ולכן לכרוז ולשותף נותרו שישה. אם לשותף סינגלטון, לכרוז חמישה קלאבים. אך מערב פתח ⁦1NT⁩ והראה יד מאוזנת, ובהמשך הראה ארבעה ספיידים. חמישה קלאבים וארבעה ספיידים אינם מתאימים ליד המאוזנת שהראה. לכן שוללים סינגלטון אצל השותף ומסיקים שהתחיל בשני קלאבים. חשוב לשמור את האס ככניסה לחיתוך העתידי.",topic:"d2",lat:!1,source:"lecture12",distractors:"suggested"},{id:"d2q20",topic:"d2",q:"השותף שלכם בצפון מוביל ⁦J♦⁩ נגד ⁦4♠⁩. בדומם ⁦K♦ 6♦ 5♦⁩, והדומם משחק ⁦5♦⁩. אתם בדרום עם ⁦A♦ 7♦ 4♦⁩. מה תשחקו?",answer:"⁦7♦⁩",wrong:["⁦A♦⁩ - יד שלישית גבוה","⁦4♦⁩ - הקלף הנמוך ביותר"],expl:"אם ה-Q הייתה אצל השותף, הוא היה מוביל בה ולא בנסיך, ולכן ה-Q אצל הכרוז. אם תשימו את ה-A על ה-5, תגביהו לכרוז שתי לקיחות: ה-Q שביד ו-K שבדומם. כשאתם משחקים ⁦7♦⁩ ומגלגלים את הנסיך של השותף, זכיית ה-Q היא הלקיחה האחרונה של הכרוז בסדרה: ה-K בדומם וה-A שלכם יושב מאחוריו. הכלל של כיסוי תמונה אינו חל, כי הנסיך הוא קלף של השותף. ה-7 גם מעודד אותו להמשיך בסדרה.",lat:!1,source:"lecture9",distractors:"suggested"},{id:"d3q9",topic:"d3",q:"הכרוז משחק קלף קטן ואתם ביד שנייה עם שני מכובדים צמודים, כמו ⁦K Q 3⁩. מה הכלל?",answer:"משחקים את הנמוך מבין המכובדים הצמודים (מפצלים)",wrong:["משחקים קלף קטן - יד שנייה קטן בכל מצב","משחקים את הגבוה מבין המכובדים הצמודים","מפצלים רק עם ⁦K Q⁩, ולא עם ⁦Q J⁩ או ⁦J 10⁩"],expl:"כששני מכובדים צמודים אצלכם, לא משחקים יד שנייה קטן אלא הנמוך מביניהם. הכלל חל על ⁦K Q⁩, על ⁦Q J⁩, על ⁦J 10⁩ ואפילו על ⁦10 9⁩. הוא אינו חל על מכובדים שאינם צמודים, כמו ⁦K J⁩: שם משחקים קטן כרגיל.",lat:!1,source:"lecture9",distractors:"suggested"},{id:"d3q10",topic:"d3",q:"אתם ביד שנייה עם ⁦K Q 3⁩ והכרוז משחק קלף קטן. מדוע משחקים את ה-Q ולא קלף קטן ולא את ה-K?",answer:"הנמוך מכריח את האס לצאת ומסמן לשותף שהמלך אצלכם",wrong:["כדי שהכרוז יחשוב שהמלך אצל השותף","כדי לשמור את שני המכובדים ללקיחה מאוחרת","כי תמיד משחקים את הקלף הנמוך ביותר שמסוגל לזכות"],expl:"יש שתי סיבות. הראשונה: אם תשחקו קטן, קלף ביניים אצל הכרוז, כמו 10, עלול לגנוב לקיחה מתחת לרצף שלכם. כשאתם מפצלים, הכרוז חייב להוציא את האס, והמכובד הנותר שלכם מתבצר. השנייה: סימון. מ-⁦K Q 3⁩ משחקים את ה-Q. השותף מבין שאין לכם את הנסיך, אחרת הייתם משחקים אותו, ושכמעט בוודאות יש לכם את המלך.",lat:!1,source:"lecture9",distractors:"suggested"},{id:"d3q11",topic:"d3",q:"אתם ביד שנייה עם ⁦Q J 10⁩ וקלף קטן. הכרוז משחק קלף קטן. מה תשחקו?",answer:"⁦10⁩ - הנמוך ברצף",wrong:["קלף קטן - יד שנייה קטן","⁦Q⁩ - הגבוה ברצף","⁦J⁩ - הקלף האמצעי"],expl:"יש לכם רצף, ולכן לא משחקים יד שנייה קטן אלא את הנמוך ברצף. הוא עושה את אותה עבודה: מכריח את הכרוז להשתמש בבכיר ומסמן לשותף. זה אותו עיקרון של הנמוך שעושה את העבודה.",lat:!1,source:"lecture9",distractors:"suggested"},{id:"d3q13",topic:"d4",q:"הכרוז משחק ⁦Q♦⁩ מידו. בדומם ⁦K♦ 6♦ 2♦⁩, ואתם ביד שנייה עם ⁦A♦ 4♦ 3♦⁩. האם לשים את האס?",answer:"כן - תמונה מכסה תמונה: האס על הקווין",wrong:["לא - משחקים קלף קטן, כמו ביד שנייה קטן","לא - האס יגביה את המלך שבדומם","אין הבדל בין האפשרויות"],expl:"חובה לשים את ה-A על ה-Q, גם כשזה מגביה את ה-K שבדומם. למצליח נשארת רק לקיחה גבוהה אחת בסדרה.",lat:!1,source:"lecture11",distractors:"suggested"},{id:"d3q14",topic:"d4",q:"הכרוז משחק ⁦Q♦⁩ מידו. בדומם שלושה קלפים קטנים, ⁦7♦ 6♦ 2♦⁩, ואתם ביד שנייה עם ⁦A♦ 4♦ 3♦⁩. האם לשים את האס?",answer:"לא - משחקים קלף קטן",wrong:["כן - תמונה מכסה תמונה","כן - לפני שהכרוז מגביה את הסדרה","תלוי רק בחוזה"],expl:"לא שמים את האס. אם ה-K אצל הכרוז, תאכלו אותו אחר כך. אם ה-K אצל השותף, חשוב לתת לו לזכות בו. אילו הכרוז היה משחק ⁦K♦⁩, היה צריך לשים את ה-A.",lat:!1,source:"lecture11",distractors:"suggested"},{id:"d3q15",topic:"d4",q:"הדומם מוביל ⁦Q♦⁩ מתוך ⁦Q J 3⁩. אתם ביד שנייה עם ⁦K♦ 4♦ 2♦⁩. האם לכסות במלך?",answer:"לא - הנסיך צמוד לקווין, ותמונות צמודות לא מכסים",wrong:["כן - תמיד מכסים תמונה בתמונה","כן - אבל רק בחוזה צבע","כן - כדי להגביה את הקלפים הקטנים שלכם"],expl:"לא מכסים את ה-Q, כי ה-J צמוד אליו. אם המצליח ממשיך אחר כך בג׳ק, מכסים אותו. אם הוא ממשיך בקלף קטן, משחקים קלף קטן.",lat:!1,source:"lecture11",distractors:"suggested"},{id:"d3q16",topic:"d4",q:"מהו היוצא מן הכלל של ״תמונות צמודות לא מכסים״?",answer:"דאבלטון - מכסים גם כשהתמונות צמודות",wrong:["כשיש לכם אס","כשהחוזה בגובה שבע","כשהכרוז מוביל מידו ולא מהדומם"],expl:"כשיש לכם דאבלטון מכסים. לדוגמה: בדומם ⁦Q J 4 2⁩, בידכם ⁦K 5⁩, והמצליח מחזיק ⁦A 9 7⁩ ומשחק את ה-Q. מכסים ב-K: ה-A לוקח, והנסיך המוגבה הוא לקיחה אחת בלבד, ולמצליח אין לקיחה שלישית. בלי הכיסוי, המצליח ממשיך בקלף קטן, אתם חייבים לשים את ה-K, והנסיך הופך ללקיחה שלישית.",lat:!1,source:"lecture11",distractors:"suggested"},{id:"d3q17",topic:"d4",q:"הכרזה: מערב ⁦2♠⁩ חלש, מזרח ⁦2NT⁩ (שואל), מערב ⁦3♥⁩, מזרח ⁦4♠⁩. אתם בצפון עם ⁦♠ K76⁩ ומובילים ⁦K♥⁩. בדומם במזרח: ⁦♠ 854⁩, ⁦♥ 765⁩, ⁦♦ AKQJ⁩, ⁦♣ A96⁩. הכרוז זוכה באס הארט ומשחק ⁦Q♠⁩ מידו. האם תכסו במלך?",answer:"לא - משחקים קלף קטן",wrong:["כן - ⁦K♠⁩ על ⁦Q♠⁩, תמונה מכסה תמונה","כן - ⁦K♠⁩, כדי שהכרוז לא יעקוף אותו","כן - ⁦K♠⁩, כדי להגביה קלף ביניים אצל השותף"],expl:"לכרוז שישה ספיידים, בדומם שלושה ולכם שלושה, ולכן לשותף יש ספייד יחיד. אם הקלף היחיד הוא ה-A, כיסוי במלך יפגיש את ה-K וה-A באותה לקיחה. אם הוא קלף קטן, אין אצל השותף קלף ביניים שהכיסוי יגביה. ה-K שלכם נשאר מוגן גם אחרי משחק קטן. לפני שמכסים שואלים מה הכיסוי משיג: הגבהת קלף ביניים או מניעת לקיחה זולה. אם אין כזה, לא מכסים.",lat:!1,source:"lecture13",distractors:"suggested"},{id:"d3q18",topic:"d4",q:"הכרזה: מערב ⁦1♠⁩, צפון ⁦2♣⁩, מזרח ⁦3♣⁩ (תמיכה בספייד), מערב
